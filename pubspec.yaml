name: insta_grab
description: Download, crop, and resize images from Instagram share URLs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  html: ^0.15.4
  crop_your_image: ^1.1.0
  image: ^4.1.7
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
